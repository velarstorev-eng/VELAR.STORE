<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELAR — Track Your Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080808;
      --surface: #111111;
      --surface2: #161616;
      --surface3: #1e1e1e;
      --border: rgba(255,255,255,0.07);
      --text: #f0ece4;
      --text-dim: rgba(240,236,228,0.45);
      --text-dimmer: rgba(240,236,228,0.2);
      --accent: #c9a96e;
      --accent-dim: rgba(201,169,110,0.15);
      --accent-glow: rgba(201,169,110,0.25);
      --red: #e05252;
      --green: #52e07a;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --transition: cubic-bezier(0.16,1,0.3,1);
    }

    [data-theme="light"] {
      --bg: #f5f3ee;
      --surface: #eeece7;
      --surface2: #e8e5df;
      --surface3: #dedad3;
      --border: rgba(0,0,0,0.08);
      --text: #1a1814;
      --text-dim: rgba(26,24,20,0.5);
      --text-dimmer: rgba(26,24,20,0.2);
    }

    [dir="rtl"] { --font-mono: 'Cairo', sans-serif; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding-top: 70px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; width: 100%;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 70px;
      background: rgba(8,8,8,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    [data-theme="light"] nav { background: rgba(245,243,238,0.88); }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.9rem;
      letter-spacing: 0.35em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-links a {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    .nav-right { display: flex; align-items: center; gap: 0.6rem; }

    .icon-btn {
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      transition: all 0.2s;
      font-family: var(--font-mono);
    }

    .icon-btn:hover { color: var(--text); background: var(--surface); border-color: var(--border); }

    /* ── HERO ── */
    .track-hero {
      padding: 5rem 3rem 3rem;
      text-align: center;
      position: relative;
    }

    .track-hero::before {
      content: 'TRACK';
      position: absolute;
      font-family: var(--font-display);
      font-size: 20vw;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,169,110,0.06);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      pointer-events: none;
    }

    .track-eyebrow {
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeup 0.8s var(--transition) 0.1s forwards;
    }

    .track-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: 0.1em;
      line-height: 0.9;
      color: var(--text);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeup 0.8s var(--transition) 0.2s forwards;
    }

    .track-subtitle {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeup 0.8s var(--transition) 0.3s forwards;
    }

    /* ── SEARCH BOX ── */
    .search-section {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 2rem;
      opacity: 0;
      animation: fadeup 0.8s var(--transition) 0.4s forwards;
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .search-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1rem;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 0.8rem;
    }

    .search-input {
      flex: 1;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--text);
      outline: none;
      font-size: 0.82rem;
      transition: border 0.2s, box-shadow 0.2s;
      direction: ltr;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search-input::placeholder { color: var(--text-dimmer); }

    .search-btn {
      padding: 0 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s var(--transition);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px var(--accent-glow);
    }

    .search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .search-hint {
      font-size: 0.58rem;
      color: var(--text-dimmer);
      letter-spacing: 0.1em;
      margin-top: 0.8rem;
      text-align: center;
    }

    /* ── RESULTS ── */
    .results-section {
      max-width: 800px;
      margin: 0 auto 5rem;
      padding: 0 2rem;
    }

    .results-header {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .results-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
      animation: fadeup 0.5s var(--transition) both;
    }

    .order-card-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .order-card-header:hover { background: var(--surface2); }

    .order-id {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    .order-date {
      font-size: 0.6rem;
      color: var(--text-dimmer);
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    .order-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-pending { background: var(--accent-dim); color: var(--accent); }
    .status-pending .status-dot { background: var(--accent); }

    .status-confirmed { background: rgba(82,224,122,0.1); color: var(--green); }
    .status-confirmed .status-dot { background: var(--green); animation: pulse 1.5s infinite; }

    .status-shipped { background: rgba(82,150,224,0.1); color: #5296e0; }
    .status-shipped .status-dot { background: #5296e0; animation: pulse 1.5s infinite; }

    .status-delivered { background: rgba(82,224,122,0.15); color: var(--green); }
    .status-delivered .status-dot { background: var(--green); }

    .status-cancelled { background: rgba(224,82,82,0.1); color: var(--red); }
    .status-cancelled .status-dot { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .order-card-body {
      padding: 1.5rem;
      display: none;
    }

    .order-card-body.open { display: block; }

    /* ── TIMELINE ── */
    .timeline {
      margin-bottom: 2rem;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }

    [dir="rtl"] .timeline::before { left: auto; right: 11px; }

    .timeline-step {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .timeline-step:last-child { margin-bottom: 0; }

    .timeline-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      position: relative;
      z-index: 1;
    }

    .timeline-step.done .timeline-dot {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--bg);
    }

    .timeline-step.active .timeline-dot {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      animation: pulse 1.5s infinite;
    }

    .timeline-content { flex: 1; padding-top: 2px; }

    .timeline-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .timeline-step.done .timeline-label,
    .timeline-step.active .timeline-label { color: var(--text); }

    .timeline-desc {
      font-size: 0.6rem;
      color: var(--text-dimmer);
      margin-top: 2px;
      letter-spacing: 0.05em;
    }

    /* ── ORDER ITEMS ── */
    .order-items-title {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .order-item {
      display: flex;
      gap: 1rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
    }

    .order-item:last-child { border-bottom: none; }

    .order-item-img {
      width: 55px;
      height: 70px;
      background: var(--surface2);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--surface3);
      overflow: hidden;
    }

    .order-item-name {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .order-item-meta {
      font-size: 0.58rem;
      color: var(--text-dimmer);
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
    }

    .order-item-price {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--accent);
    }

    /* ── ORDER TOTALS ── */
    .order-totals {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .total-row.final {
      font-size: 0.75rem;
      color: var(--text);
      font-weight: 700;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 0.8rem;
    }

    .total-row.final span:last-child {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--accent);
    }

    /* ── CUSTOMER INFO ── */
    .customer-info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--surface2);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .info-item-label {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dimmer);
      margin-bottom: 0.3rem;
    }

    .info-item-value {
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── EMPTY / ERROR STATES ── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
      animation: fadeup 0.5s var(--transition) both;
    }

    .state-icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      display: block;
    }

    .state-title {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.15em;
      color: var(--text);
      margin-bottom: 0.8rem;
    }

    .state-desc {
      font-size: 0.68rem;
      color: var(--text-dim);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    /* ── LOADING ── */
    .loading-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeup {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── WHATSAPP ── */
    .whatsapp-float {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      background-color: #25d366;
      color: #fff;
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 8000;
      transition: transform 0.3s;
      text-decoration: none;
    }

    .whatsapp-float:hover { transform: scale(1.1); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 0 1.5rem; }
      .nav-links { display: none; }
      .track-hero { padding: 3rem 1.5rem 2rem; }
      .search-section { padding: 0 1.5rem; }
      .results-section { padding: 0 1.5rem; }
      .search-row { flex-direction: column; }
      .search-btn { padding: 0.9rem; justify-content: center; }
      .customer-info { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function t() { return T[currentLang]; }

    window.toggleTheme = function() {
      const el = document.documentElement;
      const isDark = el.getAttribute('data-theme') === 'dark';
      el.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').innerHTML = isDark
        ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }

    window.toggleLang = function() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;
      document.getElementById('langText').textContent = currentLang === 'en' ? 'AR' : 'EN';
      updateStaticText();
    }

    function updateStaticText() {
      const lang = t();
      document.getElementById('eyebrow').textContent = lang.eyebrow;
      document.getElementById('trackTitle').innerHTML = lang.title.replace('\n', '<br>');
      document.getElementById('trackSub').textContent = lang.sub;
      document.getElementById('searchLabel').textContent = lang.searchLabel;
      document.getElementById('searchBtnText').textContent = lang.searchBtn;
      document.getElementById('searchHint').textContent = lang.searchHint;
    }

    function getStatusClass(status) {
      const map = { Pending: 'pending', Confirmed: 'confirmed', Shipped: 'shipped', Delivered: 'delivered', Cancelled: 'cancelled' };
      return map[status] || 'pending';
    }

    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function buildTimeline(status) {
      const steps = t().timeline[status] || t().timeline['Pending'];
      return `<div class="timeline">${steps.map(step => `
        <div class="timeline-step ${step.done ? 'done' : ''} ${step.active ? 'active' : ''}">
          <div class="timeline-dot">${step.done ? '✓' : ''}</div>
          <div class="timeline-content">
            <div class="timeline-label">${step.label}</div>
            <div class="timeline-desc">${step.desc}</div>
          </div>
        </div>`).join('')}
      </div>`;
    }

    function renderOrder(order, idx) {
      const statusClass = getStatusClass(order.status);
      const statusLabel = t().statuses[order.status] || order.status;
      const items = order.items || [];
      const shortId = order.id.slice(-6).toUpperCase();

      return `
        <div class="order-card" style="animation-delay:${idx * 0.1}s">
          <div class="order-card-header" onclick="toggleOrder('${order.id}')">
            <div>
              <div class="order-id">#${shortId}</div>
              <div class="order-date">${t().orderDate} ${formatDate(order.createdAt)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;">
              <span style="font-family:var(--font-display);font-size:1.1rem;color:var(--accent);">EGP ${parseFloat(order.total || 0).toFixed(2)}</span>
              <div class="order-status status-${statusClass}">
                <div class="status-dot"></div>
                ${statusLabel}
              </div>
            </div>
          </div>
          <div class="order-card-body" id="body-${order.id}">
            ${buildTimeline(order.status)}

            <div class="order-items-title">${t().items} (${items.length})</div>
            ${items.map(item => `
              <div class="order-item">
                <div class="order-item-img">VLR</div>
                <div style="flex:1;">
                  <div class="order-item-name">${item.name || '—'}</div>
                  <div class="order-item-meta">${item.size ? 'Size: ' + item.size : ''} ${item.color ? '· Color: ' + item.color : ''} · Qty: ${item.qty}</div>
                  <div class="order-item-price">EGP ${(parseFloat(item.price || 0) * item.qty).toFixed(2)}</div>
                </div>
              </div>`).join('')}

            <div class="order-totals">
              <div class="total-row"><span>${t().subtotal}</span><span>EGP ${parseFloat(order.subtotal || 0).toFixed(2)}</span></div>
              ${order.discount > 0 ? `<div class="total-row" style="color:var(--accent)"><span>${t().discount}</span><span>- EGP ${parseFloat(order.discount).toFixed(2)}</span></div>` : ''}
              <div class="total-row"><span>${t().shipping}</span><span>${order.shipping === 0 ? 'FREE 🎉' : 'EGP ' + parseFloat(order.shipping || 60).toFixed(2)}</span></div>
              <div class="total-row final"><span>${t().total}</span><span>EGP ${parseFloat(order.total || 0).toFixed(2)}</span></div>
            </div>

            <div class="customer-info">
              <div>
                <div class="info-item-label">${t().name}</div>
                <div class="info-item-value">${order.customer?.firstName || ''} ${order.customer?.lastName || ''}</div>
              </div>
              <div>
                <div class="info-item-label">${t().phone}</div>
                <div class="info-item-value" style="direction:ltr;">${order.customer?.phone || '—'}</div>
              </div>
              <div style="grid-column:1/-1;">
                <div class="info-item-label">${t().address}</div>
                <div class="info-item-value">${order.customer?.address || ''} - ${order.customer?.city || ''} - ${order.customer?.governorate || ''}</div>
              </div>
              <div>
                <div class="info-item-label">${t().payMethod}</div>
                <div class="info-item-value">${order.paymentMethod === 'COD' ? '💵 Cash on Delivery' : '💳 Card'}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    window.toggleOrder = function(id) {
      const body = document.getElementById(`body-${id}`);
      if (body) body.classList.toggle('open');
    }

window.searchOrders = async function() {
  let phone = document.getElementById('phoneInput').value.trim();
  phone = phone.replace(/\s+/g, ''); // شيلنا المسافات
  
  if (!phone) return; // لو العميل مكتبش حاجة، متعملش بحث


      const btn = document.getElementById('searchBtn');
      const results = document.getElementById('resultsSection');

      btn.disabled = true;
      document.getElementById('searchBtnText').textContent = t().searching.replace('...', '');
      results.innerHTML = `
        <div class="loading-card">
          <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
            <div class="skeleton" style="width:120px;height:20px;"></div>
            <div class="skeleton" style="width:80px;height:20px;"></div>
          </div>
          <div class="skeleton" style="width:60%;height:12px;margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="width:40%;height:12px;"></div>
        </div>`;

      try {
        const q = query(collection(db, "orders"), where("customer.phone", "==", phone));
        const snap = await getDocs(q);

        if (snap.empty) {
          results.innerHTML = `
            <div class="state-box">
              <span class="state-icon">📦</span>
              <div class="state-title">${t().noOrders}</div>
              <p class="state-desc">${t().noOrdersDesc.replace('\n', '<br>')}</p>
            </div>`;
        } else {
          const orders = [];
          snap.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
          orders.sort((a, b) => {
            const aTime = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
            const bTime = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
            return bTime - aTime;
          });

          results.innerHTML = `
            <div class="results-header">${t().resultsFound(orders.length)}</div>
            ${orders.map((o, i) => renderOrder(o, i)).join('')}`;

          // Auto-open first order
          const firstBody = document.getElementById(`body-${orders[0].id}`);
          if (firstBody) firstBody.classList.add('open');
        }
      } catch (e) {
        console.error(e);
        results.innerHTML = `
          <div class="state-box">
            <span class="state-icon">⚠️</span>
            <div class="state-title">${t().errorTitle}</div>
            <p class="state-desc">${t().errorDesc}</p>
          </div>`;
      } finally {
        btn.disabled = false;
        document.getElementById('searchBtnText').textContent = t().searchBtn;
      }
    }

    // Enter key support
    document.getElementById('phoneInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchOrders();
    });
  </script>
